[mod-setting-description]
debug-tracker=Logs what the focus tracker is thinking to Factorio's current.log. Enable if you're reporting a bug, it'll make it way easier to troubleshoot as it contains tick-precise information
camera-stopping-opens-remote=If enabled, cam's final location is opened in Remote view.\nIf disabled, it'll go back to location where you started cam
skip-ahead=If the followed item is stuck, don't wait for that exact item.\nOn a full belt cam jumps to the frontmost item of the same kind further down, and follows the first same item an inserter picks up from that belt stretch.\nIf nothing gets taken out of a building (chest, wagon, full machine output), cam follows an inserter that already holds the same item from there.\nAn inserter that can't drop onto a full belt hands over to the frontmost same item on that belt.
skip-ahead-ticks=How many ticks the followed item has to be stuck before skipping ahead. 60 ticks = 1 second.
multiple-outputs=Which product cam follows out of a recipe with several, when no follow rule applies.\nFirst out: whichever is taken out first.\nMain product: the recipe's main product if it has one, otherwise first out.\nNew item: the main product or another product cam hasn't followed yet, so ore refining loops don't go in circles.

[string-mod-setting]
multiple-outputs-first-out=First out
multiple-outputs-main-product=Main product
multiple-outputs-new-item=New item

